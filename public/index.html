<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Links</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --gold: #c9a84c;
      --gold-light: #e8c96a;
      --gold-dim: #7a6230;
      --bg: #080a0e;
      --bg-card: #0f1218;
      --bg-card-hover: #161c26;
      --border: rgba(201, 168, 76, 0.2);
      --border-hover: rgba(201, 168, 76, 0.7);
      --text: #e8e4d8;
      --text-dim: #7a7565;
      --red: #c94c4c;
      --green: #4cc97a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      user-select: none;
    }

    /* Cinematic grain overlay */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
      opacity: 0.6;
    }

    /* Top vignette */
    body::after {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 200px;
      background: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent);
      pointer-events: none;
      z-index: 10;
    }

    .app {
      max-width: 1600px;
      margin: 0 auto;
      padding: 48px 60px 60px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── HEADER ── */
    header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      margin-bottom: 56px;
    }

    .brand {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(48px, 6vw, 86px);
      letter-spacing: 0.06em;
      line-height: 0.9;
      background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold) 50%, var(--gold-dim) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 30px rgba(201,168,76,0.3));
    }

    .brand-sub {
      font-size: clamp(9px, 1vw, 12px);
      letter-spacing: 0.35em;
      color: var(--gold-dim);
      text-transform: uppercase;
      font-weight: 300;
      padding-left: 3px;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
    }

    .dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: pulse 2s infinite;
    }
    .dot.scanning { background: var(--gold); }
    .dot.done { background: var(--green); animation: none; }
    .dot.error { background: var(--red); animation: none; }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    /* ── DIVIDER ── */
    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, var(--gold-dim), var(--gold), var(--gold-dim), transparent);
      margin-bottom: 48px;
      opacity: 0.4;
    }

    /* ── GRID ── */
    .grid-label {
      font-size: 10px;
      letter-spacing: 0.4em;
      color: var(--text-dim);
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .tiles-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      grid-template-rows: repeat(2, 1fr);
      gap: 16px;
      flex: 1;
    }

    /* ── TILE ── */
    .tile {
      position: relative;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 28px 24px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 160px;
      outline: none;
      text-decoration: none;
    }

    .tile::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(201,168,76,0.05) 0%, transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .tile::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, var(--gold), transparent);
      transform: scaleX(0);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .tile:hover, .tile:focus {
      border-color: var(--border-hover);
      background: var(--bg-card-hover);
      transform: translateY(-4px);
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 30px rgba(201,168,76,0.08);
    }

    .tile:hover::before, .tile:focus::before { opacity: 1; }
    .tile:hover::after, .tile:focus::after { transform: scaleX(1); }

    .tile:active { transform: translateY(-2px); }

    .tile.loading {
      pointer-events: none;
      opacity: 0.5;
    }

    .tile.skeleton .tile-name,
    .tile.skeleton .tile-domain,
    .tile.skeleton .tile-number {
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      color: transparent;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    .tile-number {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 11px;
      letter-spacing: 0.3em;
      color: var(--gold-dim);
      line-height: 1;
    }

    .tile-center {
      flex: 1;
      display: flex;
      align-items: center;
      padding: 12px 0;
    }

    .tile-name {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(22px, 2.2vw, 32px);
      letter-spacing: 0.08em;
      line-height: 1.1;
      color: var(--text);
      transition: color 0.2s;
    }

    .tile:hover .tile-name { color: var(--gold-light); }

    .tile-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .tile-domain {
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      font-weight: 300;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 80%;
    }

    .tile-arrow {
      font-size: 16px;
      color: var(--gold-dim);
      transition: all 0.2s;
      opacity: 0;
    }

    .tile:hover .tile-arrow {
      opacity: 1;
      color: var(--gold);
      transform: translateX(3px);
    }

    /* ── FOOTER ── */
    footer {
      margin-top: 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-text {
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 0.15em;
    }

    .refresh-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      padding: 10px 20px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .refresh-btn:hover {
      border-color: var(--gold-dim);
      color: var(--gold);
    }

    /* Error tile */
    .tile.error-tile {
      pointer-events: none;
      opacity: 0.3;
    }

    /* Scanlines effect */
    .scanlines {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 999;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
    }

    /* Animations entrée */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    header { animation: fadeInUp 0.6s ease both; }
    .divider { animation: fadeInUp 0.6s 0.1s ease both; }
    .tiles-grid { animation: fadeInUp 0.6s 0.2s ease both; }
    footer { animation: fadeInUp 0.6s 0.4s ease both; }
  </style>
</head>
<body>
  <div class="scanlines"></div>

  <div class="app">
    <header>
      <div class="brand">
        <div class="brand-name">Stream Links</div>
        <div class="brand-sub">Streaming Explorer Engine</div>
      </div>
      <div class="status-bar">
        <div class="status-indicator" id="status">
          <div class="dot scanning" id="status-dot"></div>
          <span id="status-text">Scanning sources…</span>
        </div>
      </div>
    </header>

    <div class="divider"></div>

    <div class="grid-label">Liens actifs — 10 sources</div>

    <div class="tiles-grid" id="grid">
      <!-- Skeleton tiles -->
    </div>

    <footer>
      <span class="footer-text">Les liens sont vérifiés et fonctionnels</span>
      <button class="refresh-btn" onclick="loadLinks()">↻ Actualiser</button>
    </footer>
  </div>

  <script>
    const PLACEHOLDERS = [
      { name: "FRENCHSTREAM", domain: "frenchstream.lol" },
      { name: "WIFLIX", domain: "wiflix.store" },
      { name: "FILMSTREAMING", domain: "filmstreaming1080p.com" },
      { name: "CPASMIEUX", domain: "cpasmieux.cx" },
      { name: "TIREXO", domain: "tirexo.biz" },
      { name: "SOKROSTREAM", domain: "sokrostream.xyz" },
      { name: "VOIRSERIES", domain: "voirseries.io" },
      { name: "DPSTREAM", domain: "dpstream.net" },
      { name: "PAPYSTREAMING", domain: "papystreaming.org" },
      { name: "STREAMCOMPLET", domain: "streamcomplet.me" },
    ];

    function getDomain(url) {
      try {
        return new URL(url).hostname.replace('www.', '');
      } catch { return url; }
    }

    function getSiteName(url) {
      try {
        const host = new URL(url).hostname.replace('www.', '');
        return host.split('.')[0].toUpperCase();
      } catch { return url.toUpperCase(); }
    }

    function renderSkeletons() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let i = 0; i < 10; i++) {
        const el = document.createElement('div');
        el.className = 'tile skeleton loading';
        el.innerHTML = `
          <div class="tile-number">0${i+1 < 10 ? '0'+(i+1) : i+1}</div>
          <div class="tile-center"><div class="tile-name">${PLACEHOLDERS[i].name}</div></div>
          <div class="tile-meta">
            <div class="tile-domain">${PLACEHOLDERS[i].domain}</div>
            <div class="tile-arrow">→</div>
          </div>`;
        grid.appendChild(el);
      }
    }

    function renderLinks(links) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';

      // Pad to 10 if fewer results
      while (links.length < 10) {
        links.push(null);
      }

      links.slice(0, 10).forEach((url, i) => {
        const num = String(i + 1).padStart(2, '0');
        const el = document.createElement('a');

        if (url) {
          el.href = url;
          el.target = '_blank';
          el.rel = 'noopener noreferrer';
          el.className = 'tile';
          el.tabIndex = 0;
          el.innerHTML = `
            <div class="tile-number">${num}</div>
            <div class="tile-center"><div class="tile-name">${getSiteName(url)}</div></div>
            <div class="tile-meta">
              <div class="tile-domain">${getDomain(url)}</div>
              <div class="tile-arrow">→</div>
            </div>`;
        } else {
          el.className = 'tile error-tile';
          el.innerHTML = `
            <div class="tile-number">${num}</div>
            <div class="tile-center"><div class="tile-name" style="color:var(--text-dim);font-size:18px">NON DISPONIBLE</div></div>
            <div class="tile-meta"><div class="tile-domain">—</div></div>`;
        }

        grid.appendChild(el);
      });
    }

    function setStatus(state, text) {
      document.getElementById('status-dot').className = `dot ${state}`;
      document.getElementById('status-text').textContent = text;
    }

    async function loadLinks() {
      renderSkeletons();
      setStatus('scanning', 'Scanning sources…');

      try {
        const res = await fetch('/api/links');
        if (!res.ok) throw new Error('API error');
        const data = await res.json();

        if (data.links && data.links.length > 0) {
          renderLinks(data.links);
          setStatus('done', `${data.links.length} liens actifs`);
        } else {
          // Fallback: show placeholder tiles as disabled
          renderLinks([]);
          setStatus('error', 'Aucun lien trouvé');
        }
      } catch (e) {
        console.error(e);
        // Show placeholder tiles with mock URLs for demo
        const fallback = PLACEHOLDERS.map(p => `https://${p.domain}`);
        renderLinks(fallback);
        setStatus('error', 'Mode hors ligne — liens non vérifiés');
      }
    }

    loadLinks();
  </script>
</body>
</html>
